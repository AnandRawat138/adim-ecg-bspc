# Training details
optimizer:
  name: "adamw"             # "adam", "adamw", "sgd", "rmsprop"
  lr: 1e-3
  weight_decay: 1e-4
  momentum: 0.9             # For SGD

scheduler:
  name: "cosine"            # "cosine", "plateau", "onecycle", "none"
  warmup_epochs: 5
  max_lr: 3e-3              # For OneCycleLR
  pct_start: 0.3            # For OneCycleLR
  factor: 0.1               # For ReduceLROnPlateau
  patience: 5               # For ReduceLROnPlateau

loss:
  name: "focal"             # "cross_entropy", "focal", "weighted_ce", "dice", "label_smoothing"
  label_smoothing: 0.1
  focal_alpha: 0.25
  focal_gamma: 2.0

epochs: 50
batch_size: 128
grad_accumulation_steps: 1
grad_clip_norm: 1.0

early_stopping:
  patience: 10
  monitor: "val_f1"         # Metric to monitor
  mode: "max"               # "min" or "max"

checkpoint:
  save_dir: "${hydra:runtime.cwd}/checkpoints"
  monitor: "val_f1"
  mode: "max"

output_dir: "${hydra:runtime.cwd}/experiments/runs"
