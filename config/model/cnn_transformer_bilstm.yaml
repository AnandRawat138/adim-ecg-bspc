# CNN + Transformer + BiLSTM Configuration
name: "cnn_transformer_bilstm"
input_channels: 12
num_classes: 5

# CNN parameters
filters: [64, 128]
kernel_size: 5
stride: 2
dropout: 0.1

# Transformer parameters
embed_dim: 128
num_heads: 4
num_layers: 2
dim_feedforward: 512
transformer_dropout: 0.1

# BiLSTM parameters
hidden_dim: 128
lstm_layers: 1
lstm_dropout: 0.2
pooling: "attention"
