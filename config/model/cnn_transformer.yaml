# CNN + Transformer Configuration
name: "cnn_transformer"
input_channels: 12
num_classes: 5

# CNN feature extractor parameters
filters: [64, 128, 256]
kernel_size: 5
stride: 2
dropout: 0.1

# Transformer parameters
embed_dim: 256
num_heads: 8
num_layers: 4
dim_feedforward: 1024
transformer_dropout: 0.1
pooling: "attention"       # "attention" or "cls" or "mean"
